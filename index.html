
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xoş Gəlmisiniz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0f0f1a;
            color: white;
        }
        .container { text-align: center; padding: 20px; }
        
        h1 { margin-bottom: 30px; font-size: 28px; color: #fff; }

        .main-btn {
            padding: 18px 40px;
            margin: 15px auto;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            display: block;
            width: 280px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-1 { background: linear-gradient(45deg, #27ae60, #2ecc71); }
        .btn-2 { background: linear-gradient(45deg, #2980b9, #3498db); }
        .main-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

        /* Modal / Təlimat Pəncərəsi */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
        }
        .instruction-img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            max-height: 350px;
            object-fit: contain;
        }
        .instruction-text {
            font-size: 17px;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }
        .nav-btn {
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: inline-block;
            text-decoration: none;
        }
        .next-btn { background: #34495e; color: white; }
        .go-btn { background: #e67e22; color: white; }
        
        .close-x {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px; color: #999;
            cursor: pointer;
        }
        .hidden { display: none !important; }

        /* Sayğac hissəsi */
        .counter {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Seçim edin</h1>
        
        <button class="main-btn btn-1" onclick="openModal('1')">Keçid 1</button>
        <button class="main-btn btn-2" onclick="openModal('2')">Keçid 2</button>

        <div class="counter">
            Sayta giriş sayı: <br>
            <img src="https://profile-counter.glitch.me/SENIN_ADIN/count.svg" alt="visitor count">
        </div>
    </div>

    <div id="guideModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <div id="imgBox"></div>
            <p id="guideText" class="instruction-text"></p>
            
            <a id="btnDownload" href="https://play.google.com/store/apps/details?id=com.bishir.bishir" target="_blank" class="nav-btn go-btn hidden">Yüklə</a>
            <button id="btnNext" class="nav-btn next-btn hidden" onclick="nextStep()">Növbəti addım</button>
            <a id="btnFinal" href="https://bishir.app/profiles/username/skwjrj" target="_blank" class="nav-btn go-btn hidden">Profilə keçid et</a>
        </div>
    </div>

    <script>
        const modal = document.getElementById('guideModal');
        const gText = document.getElementById('guideText');
        const imgBox = document.getElementById('imgBox');
        const btnDownload = document.getElementById('btnDownload');
        const btnNext = document.getElementById('btnNext');
        const btnFinal = document.getElementById('btnFinal');

        let step = 1;

        function openModal(type) {
            reset();
            if (type === '1') {
                gText.innerText = "Ekranda çıxan proqramı yükləyin və quraşdırın.";
                btnDownload.classList.remove('hidden');
            } else {
                step = 1;
                showStep();
            }
            modal.style.display = 'flex';
        }

        function showStep() {
            btnNext.classList.add('hidden');
            btnFinal.classList.add('hidden');

            if (step === 1) {
                imgBox.innerHTML = '<img src="telimat1.jpg" class="instruction-img">';
                gText.innerText = "Ekranda olan səhifəni axtarışa verib işarələnən posta girin.";
                btnNext.classList.remove('hidden');
            } else if (step === 2) {
                imgBox.innerHTML = '<img src="telimat2.jpg" class="instruction-img">';
                gText.innerText = "İşarələnən hədiyyə qutusuna giriş edin.";
                btnNext.classList.remove('hidden');
            } else if (step === 3) {
                imgBox.innerHTML = '<img src="telimat3.jpg" class="instruction-img">';
                gText.innerText = "Ekranda işarələnən hədiyyəni göndərin.";
                btnFinal.classList.remove('hidden');
            }
        }

        function nextStep() {
            step++;
            showStep();
        }

        function reset() {
            imgBox.innerHTML = "";
            btnDownload.classList.add('hidden');
            btnNext.classList.add('hidden');
            btnFinal.classList.add('hidden');
        }

        function closeModal() { modal.style.display = 'none'; }
        window.onclick = function(e) { if(e.target == modal) closeModal(); }
    </script>

</body>
</html>
