<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Səhifəsi</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: white; }
        .container { text-align: center; }
        .main-btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; color: white; font-weight: bold; width: 250px; display: block; }
        .btn-1 { background: #27ae60; }
        .btn-2 { background: #2980b9; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; color: #333; padding: 20px; border-radius: 15px; max-width: 350px; width: 90%; text-align: center; }
        .instruction-img { width: 100%; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        .nav-btn { padding: 10px 20px; background: #e67e22; color: white; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 10px; cursor: pointer; border: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xoş Gəlmisiniz</h1>
        <button class="main-btn btn-1" onclick="openStep(1, 'link1')">Keçid 1</button>
        <button class="main-btn btn-2" onclick="openStep(1, 'link2')">Keçid 2</button>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <div id="contentBox"></div>
            <button id="nextBtn" class="nav-btn" onclick="nextStep()">Növbəti addım</button>
            <a id="finalBtn" href="" class="nav-btn hidden" target="_blank">Davam et</a>
            <p onclick="closeModal()" style="color: #999; cursor: pointer; margin-top: 15px;">Bağla</p>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let currentMode = '';

        function openStep(step, mode) {
            currentStep = step;
            currentMode = mode;
            document.getElementById('myModal').style.display = 'flex';
            updateModal();
        }

        function updateModal() {
            const box = document.getElementById('contentBox');
            const next = document.getElementById('nextBtn');
            const final = document.getElementById('finalBtn');
            
            next.classList.add('hidden');
            final.classList.add('hidden');

            if (currentMode === 'link1') {
                box.innerHTML = '<p>Ekranda çıxan proqramı yükləyin.</p>';
                final.href = 'https://play.google.com/store/apps/details?id=com.bishir.bishir';
                final.innerText = 'Yüklə';
                final.classList.remove('hidden');
            } else {
                if (currentStep === 1) {
                    box.innerHTML = '<img src="telimat1.jpg" class="instruction-img"><p>Ekranda olan səhifəni axtarışa verib işarələnən posta girin.</p>';
                    next.classList.remove('hidden');
                } else if (currentStep === 2) {
                    box.innerHTML = '<img src="telimat2.jpg" class="instruction-img"><p>İşarələnən hədiyyə qutusuna giriş edin.</p>';
                    next.classList.remove('hidden');
                } else if (currentStep === 3) {
                    box.innerHTML = '<img src="telimat3.jpg" class="instruction-img"><p>Ekranda işarələnən hədiyyəni göndərin.</p>';
                    final.href = 'https://bishir.app/profiles/username/skwjrj';
                    final.innerText = 'Profilə keçid et';
                    final.classList.remove('hidden');
                }
            }
        }

        function nextStep() { currentStep++; updateModal(); }
        function closeModal() { document.getElementById('myModal').style.display = 'none'; }
    </script>
</body>
</html>
