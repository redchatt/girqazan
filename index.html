<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Səhifəsi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #121212; color: white; }
        .container { text-align: center; }
        .main-btn { padding: 18px 45px; margin: 15px; font-size: 20px; cursor: pointer; border: none; border-radius: 12px; color: white; font-weight: bold; display: block; width: 250px; transition: 0.3s; }
        .btn-green { background: #2ecc71; }
        .btn-blue { background: #3498db; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; overflow-y: auto; padding: 20px; z-index: 1000; }
        .modal-content { background: white; color: #333; padding: 25px; border-radius: 20px; max-width: 450px; width: 100%; text-align: center; }
        .instruction-img { width: 100%; border-radius: 10px; margin-bottom: 15px; border: 2px solid #ddd; max-height: 400px; object-fit: contain; }
        .instruction-text { font-size: 18px; line-height: 1.5; margin-bottom: 20px; font-weight: 500; }
        .action-btn, .next-btn { padding: 15px 30px; text-decoration: none; color: white; border-radius: 10px; font-weight: bold; display: inline-block; margin-bottom: 15px; cursor: pointer; border: none; }
        .action-btn { background: #e67e22; }
        .next-btn { background: #34495e; }
        .close-btn { display: block; color: #888; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xoş Gəlmisiniz</h1>
        <button class="main-btn btn-green" onclick="showModal('1')">Keçid 1</button>
        <button class="main-btn btn-blue" onclick="showModal('2')">Keçid 2</button>
    </div>

    <div id="instructionModal" class="modal">
        <div class="modal-content">
            <div id="imageContainer"></div>
            <p id="instructionText" class="instruction-text"></p>
            
            <a id="downloadBtn" href="https://play.google.com/store/apps/details?id=com.bishir.bishir" target="_blank" class="action-btn hidden">Yüklə</a>
            <button id="stepBtn" class="next-btn hidden" onclick="handleSteps()">Növbəti addım</button>
            <a id="profileBtn" href="https://bishir.app/profiles/username/skwjrj" target="_blank" class="action-btn hidden">Profilə keçid et</a>
            
            <span class="close-btn" onclick="closeModal()">Geri qayıt</span>
        </div>
    </div>

    <script>
        const modal = document.getElementById('instructionModal');
        const text = document.getElementById('instructionText');
        const imgContainer = document.getElementById('imageContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const stepBtn = document.getElementById('stepBtn');
        const profileBtn = document.getElementById('profileBtn');
        
        let currentStep = 1;

        function showModal(type) {
            resetModal();
            if (type === '1') {
                text.innerText = "Ekranda çıxan proqramı yükləyin və quraşdırın.";
                downloadBtn.classList.remove('hidden');
            } else {
                currentStep = 1;
                updateStep();
                stepBtn.classList.remove('hidden');
            }
            modal.style.display = 'flex';
        }

        function updateStep() {
            if (currentStep === 1) {
                imgContainer.innerHTML = '<img src="telimat1.jpg" class="instruction-img">';
                text.innerText = "Ekranda olan səhifəni axtarışa verib işarələnən posta girin.";
            } else if (currentStep === 2) {
                imgContainer.innerHTML = '<img src="telimat2.jpg" class="instruction-img">';
                text.innerText = "İşarələnən hədiyyə qutusuna giriş edin.";
            } else if (currentStep === 3) {
                imgContainer.innerHTML = '<img src="telimat3.jpg" class="instruction-img">';
                text.innerText = "Ekranda işarələnən hədiyyəni göndərin.";
                stepBtn.classList.add('hidden');
                profileBtn.classList.remove('hidden');
            }
        }

        function handleSteps() {
            currentStep++;
            updateStep();
        }

        function resetModal() {
            imgContainer.innerHTML = "";
            downloadBtn.classList.add('hidden');
            stepBtn.classList.add('hidden');
            profileBtn.classList.add('hidden');
        }

        function closeModal() { modal.style.display = 'none'; }
        window.onclick = function(event) { if (event.target == modal) closeModal(); }
    </script>
</body>
</html>
